<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coastal sunset over the ocean with a headland and gulls" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a5a"/>
      <stop offset=".35" stop-color="#6a3f86"/>
      <stop offset=".62" stop-color="#e2587a"/>
      <stop offset=".82" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffc66b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a35e"/>
      <stop offset=".25" stop-color="#b8587a"/>
      <stop offset=".7" stop-color="#3b3c78"/>
      <stop offset="1" stop-color="#1a2150"/>
    </linearGradient>
    <linearGradient id="sunpath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb35e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#131a3d"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="400" fill="url(#sky)"/>

  <!-- stars (upper sky only) -->
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="40" r="1.3"/><circle cx="300" cy="22" r="1"/><circle cx="520" cy="58" r="1.2"/>
    <circle cx="760" cy="26" r="1"/><circle cx="980" cy="48" r="1.3"/><circle cx="1210" cy="30" r="1"/>
    <circle cx="1420" cy="62" r="1.2"/><circle cx="1540" cy="24" r="1"/>
  </g>

  <!-- sun glow and sun -->
  <circle cx="1030" cy="262" r="210" fill="url(#glow)"/>
  <circle cx="1030" cy="262" r="46" fill="#fff0b8"/>
  <circle cx="1030" cy="262" r="46" fill="#ffd36e" opacity=".35"/>

  <!-- clouds -->
  <g opacity=".85">
    <path d="M140 150 q40-26 90-10 q30-20 70 0 q40-6 60 14 H120 q-10-4 20-4z" fill="#ff8d78" opacity=".75"/>
    <path d="M520 118 q36-22 80-8 q26-16 62 2 q34-4 52 12 H500 q-8-4 20-6z" fill="#ffa56b" opacity=".7"/>
    <path d="M1180 110 q34-22 78-8 q28-18 66 2 q36-4 56 14 H1160 q-10-4 20-8z" fill="#ff8d78" opacity=".7"/>
    <path d="M760 190 q30-14 66-4 q22-12 52 2 q30-2 44 10 H746 q-6-4 14-8z" fill="#ffc17a" opacity=".65"/>
    <path d="M1380 190 q26-12 56-4 q20-10 46 2 q26-2 40 8 H1366 q-6-4 14-6z" fill="#ffb070" opacity=".6"/>
  </g>

  <!-- sea -->
  <rect y="262" width="1600" height="138" fill="url(#sea)"/>
  <!-- sun reflection -->
  <path d="M990 262 H1070 L1130 400 H930z" fill="url(#sunpath)" opacity=".75"/>
  <g stroke="#ffe3a0" stroke-linecap="round" opacity=".7">
    <path d="M985 276 h90" stroke-width="2.2"/><path d="M1000 288 h60" stroke-width="2"/>
    <path d="M975 302 h110" stroke-width="2.4"/><path d="M1005 318 h50" stroke-width="2"/>
    <path d="M960 336 h140" stroke-width="2.6"/><path d="M990 356 h80" stroke-width="2.2"/>
    <path d="M950 378 h160" stroke-width="2.6"/>
  </g>
  <!-- distant waves -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-linecap="round" stroke-width="2">
    <path d="M300 300 q14-6 28 0 t28 0"/><path d="M620 330 q14-6 28 0 t28 0"/>
    <path d="M1280 312 q14-6 28 0 t28 0"/><path d="M1440 348 q14-6 28 0 t28 0"/>
    <path d="M120 350 q14-6 28 0 t28 0"/>
  </g>
  <!-- horizon haze -->
  <rect y="256" width="1600" height="14" fill="#ffc47a" opacity=".35"/>

  <!-- headland silhouette (left) -->
  <path d="M0 400 V248 C40 244 70 232 110 236 C150 240 170 224 214 230 C250 236 262 250 296 258 C330 266 360 276 392 292 C420 306 430 330 452 352 C466 366 480 380 500 400z" fill="url(#cliff)"/>
  <!-- small sea stack -->
  <path d="M560 400 L572 330 L588 336 L596 296 L610 304 L620 400z" fill="#171d45"/>
  <!-- headland grass tufts -->
  <g fill="#1e2a52">
    <path d="M110 236 l4-14 l4 14z"/><path d="M214 230 l3-12 l4 12z"/><path d="M60 240 l3-10 l4 10z"/>
  </g>
  <!-- lighthouse on the headland -->
  <g>
    <path d="M168 232 L174 190 H186 L192 232z" fill="#e9e2f1" opacity=".92"/>
    <path d="M170 214 H190 V220 H169z" fill="#c9506a" opacity=".9"/>
    <rect x="172" y="182" width="16" height="9" fill="#1b2347"/>
    <path d="M170 182 L180 170 L190 182z" fill="#1b2347"/>
    <circle cx="180" cy="186" r="2.2" fill="#ffe08a"/>
    <path d="M180 186 L330 170 L330 202z" fill="#ffe9a8" opacity=".12"/>
  </g>

  <!-- foreground beach strip (right) -->
  <path d="M1240 400 C1320 388 1420 380 1520 384 C1560 386 1590 390 1600 392 V400z" fill="#2b2a55" opacity=".9"/>
  <path d="M1300 400 C1380 394 1460 390 1540 392 V400z" fill="#171d45" opacity=".9"/>

  <!-- gulls -->
  <g fill="none" stroke="#1b2347" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M700 120 q10-12 20 0 q10-12 20 0"/>
    <path d="M770 98 q8-10 16 0 q8-10 16 0"/>
    <path d="M880 142 q7-9 14 0 q7-9 14 0"/>
    <path d="M1340 82 q8-10 16 0 q8-10 16 0"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
